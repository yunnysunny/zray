name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Routers (mips, armv7) keep ReleaseSmall for their small flash;
        # 64-bit targets use ReleaseFast, which makes userspace crypto
        # (ws / non-Vision TLS) 2-3x faster for ~300-400 KB more binary.
        include:
          - name: mipsel-softfloat
            target: mipsel-linux-musl
            cpu: mips32r2+soft_float
            optimize: small
          - name: mips-softfloat
            target: mips-linux-musl
            cpu: mips32r2+soft_float
            optimize: small
          - name: aarch64
            target: aarch64-linux-musl
            cpu: baseline
            optimize: fast
          # Hardware AES/PMULL/SHA2 (ARMv8 Crypto Extension): most ARMv8
          # boxes (Amlogic S905/S912, RK3328/3399...). Not the Raspberry Pi 4.
          - name: aarch64-crypto
            target: aarch64-linux-musl
            cpu: cortex_a53+aes+sha2
            optimize: fast
          - name: arm-v7
            target: arm-linux-musleabihf
            cpu: generic+v7a
            optimize: small
          - name: x86_64
            target: x86_64-linux-musl
            cpu: baseline
            optimize: fast
          # AES-NI + PCLMUL. Zig's std only uses them together with AVX, so
          # this needs Sandy Bridge / Jaguar (APU2) / Zen / N100 or newer;
          # Atom-class J4125, N5105, J3455 have no AVX and stay on x86_64.
          - name: x86_64-aes
            target: x86_64-linux-musl
            cpu: x86_64_v2+aes+pclmul+avx
            optimize: fast
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: build (Release-${{ matrix.optimize }})
        run: |
          zig build --release -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} -p out
          ls -l out/bin/zray
          mv out/bin/zray zray-${{ matrix.name }}
          sha256sum zray-${{ matrix.name }} > zray-${{ matrix.name }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: zray-${{ matrix.name }}
          path: |
            zray-${{ matrix.name }}
            zray-${{ matrix.name }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
