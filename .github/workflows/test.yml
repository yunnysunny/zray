name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: zig fmt --check
        run: zig fmt --check src build.zig

      - name: unit tests
        run: zig build test --summary all

      - name: host build (debug, catches Linux-only code paths)
        run: zig build

      - name: mixed SOCKS5 / HTTP integration test
        run: python3 tools/httptest.py zig-out/bin/zray

      - name: startup smoke test
        run: sh .github/scripts/smoke.sh zig-out/bin/zray

      - name: dynamic build and tests
        run: |
          zig build test -Ddynamic=true --summary all
          zig build --release -Ddynamic=true -p out-dynamic
          python3 tools/httptest.py out-dynamic/bin/zray
          sh .github/scripts/smoke.sh out-dynamic/bin/zray

  # The same tests on the router targets, run through qemu-user. Static musl
  # binaries need no foreign sysroot, so `-fqemu` is all the build needs.
  qemu:
    name: qemu ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mipsel-softfloat
            target: mipsel-linux-musl
            cpu: mips32r2+soft_float
            optimize: small
            qemu: qemu-mipsel
          - name: mips-softfloat
            target: mips-linux-musl
            cpu: mips32r2+soft_float
            optimize: small
            qemu: qemu-mips
          # Exercises the hardware AES/PMULL code paths (qemu-user's default
          # cpu "max" implements the ARMv8 Crypto Extension).
          - name: aarch64-crypto
            target: aarch64-linux-musl
            cpu: cortex_a53+aes+sha2
            optimize: fast
            qemu: qemu-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          ${{ matrix.qemu }} --version

      - name: unit tests under qemu
        run: zig build test --summary all -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} -fqemu

      - name: startup smoke test under qemu (Release-${{ matrix.optimize }}, the shipped build)
        run: |
          zig build --release -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} -p out
          sh .github/scripts/smoke.sh out/bin/zray ${{ matrix.qemu }}
